<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Square Catalog - Raw Data View</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #2d3e50;
    }

    .meta {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 0.9rem;
    }

    .meta span {
      background: #e8e8e8;
      padding: 2px 8px;
      border-radius: 4px;
      margin: 0 4px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      font-size: 1.2rem;
      color: #888;
    }

    .error {
      text-align: center;
      padding: 40px 20px;
      color: #d32f2f;
      background: #ffeaea;
      border-radius: 8px;
      margin: 20px auto;
      max-width: 600px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    .card-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background: #eee;
      display: block;
    }

    .no-img {
      width: 100%;
      height: 250px;
      background: linear-gradient(135deg, #e0d5c1, #c9a961);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .card-body {
      padding: 16px;
    }

    .card-body h3 {
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: #2d3e50;
    }

    .card-body .price {
      font-size: 1.3rem;
      font-weight: 700;
      color: #C9A961;
      margin-bottom: 8px;
    }

    .card-body .description {
      font-size: 0.85rem;
      color: #666;
      line-height: 1.4;
      margin-bottom: 12px;
      max-height: 60px;
      overflow: hidden;
    }

    .card-body .details {
      font-size: 0.75rem;
      color: #999;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    .card-body .details div {
      margin-bottom: 3px;
      word-break: break-all;
    }

    .badge {
      display: inline-block;
      background: #C9A961;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .raw-toggle {
      text-align: center;
      margin: 30px 0;
    }

    .raw-toggle button {
      background: #2d3e50;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .raw-toggle button:hover {
      background: #1a2a38;
    }

    .raw-json {
      display: none;
      max-width: 1400px;
      margin: 20px auto;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>Square Catalog Pull</h1>
  <div class="meta" id="meta"></div>
  <div id="content"><div class="loading">Loading catalog from Square...</div></div>
  <div class="raw-toggle" id="rawToggle" style="display:none;">
    <button onclick="toggleRaw()">Show Raw JSON Response</button>
  </div>
  <pre class="raw-json" id="rawJson"></pre>

  <script>
    let rawVisible = false;

    function toggleRaw() {
      rawVisible = !rawVisible;
      const el = document.getElementById('rawJson');
      const btn = document.querySelector('.raw-toggle button');
      el.style.display = rawVisible ? 'block' : 'none';
      btn.textContent = rawVisible ? 'Hide Raw JSON Response' : 'Show Raw JSON Response';
    }

    async function loadCatalog() {
      const content = document.getElementById('content');
      const meta = document.getElementById('meta');

      try {
        const response = await fetch('/api/square/catalog');
        const data = await response.json();

        // Show raw JSON
        document.getElementById('rawJson').textContent = JSON.stringify(data, null, 2);
        document.getElementById('rawToggle').style.display = 'block';

        if (!data.success || !data.data || !data.data.products) {
          content.innerHTML = '<div class="error">API returned an error: ' + (data.error || 'Unknown error') + '</div>';
          return;
        }

        const products = data.data.products;
        meta.innerHTML = '<span>' + products.length + ' products</span> fetched at <span>' + new Date(data.timestamp).toLocaleString() + '</span>';

        if (products.length === 0) {
          content.innerHTML = '<div class="error">No products found in the Square catalog.</div>';
          return;
        }

        let html = '<div class="grid">';
        products.forEach(function(product) {
          html += '<div class="card">';

          if (product.imageUrl) {
            html += '<img class="card-img" src="' + product.imageUrl + '" alt="' + product.name + '" loading="lazy">';
          } else {
            html += '<div class="no-img">No Image</div>';
          }

          html += '<div class="card-body">';

          if (product.category) {
            html += '<span class="badge">' + product.category + '</span>';
          }

          html += '<h3>' + product.name + '</h3>';
          html += '<div class="price">' + product.priceFormatted + '</div>';

          if (product.description) {
            html += '<div class="description">' + product.description + '</div>';
          }

          html += '<div class="details">';
          html += '<div><strong>Item ID:</strong> ' + product.id + '</div>';
          html += '<div><strong>Variation ID:</strong> ' + (product.variationId || 'N/A') + '</div>';
          html += '<div><strong>Currency:</strong> ' + product.currency + '</div>';
          html += '<div><strong>Raw Price (cents):</strong> ' + product.price + '</div>';
          html += '</div>';

          html += '</div></div>';
        });
        html += '</div>';

        content.innerHTML = html;

      } catch (err) {
        content.innerHTML = '<div class="error">Failed to fetch catalog: ' + err.message + '<br><br>Make sure the server is running (npm start).</div>';
      }
    }

    loadCatalog();
  </script>
</body>
</html>
