# Gitleaks configuration for SistersPromise
# https://github.com/gitleaks/gitleaks

[extend]
useDefault = true

[allowlist]
paths = [
  '''.env\.example''',
  '''node_modules/''',
  '''bfg-passwords\.txt''',
  '''SistersPromiseMobile/''',
]
# reCAPTCHA site keys are public by design (embedded in frontend HTML)
# Match lines containing RECAPTCHA_SITE_KEY or recaptcha/api.js
regexTarget = "line"
regexes = ['''RECAPTCHA_SITE_KEY''', '''recaptcha/api\.js\?render=''']
